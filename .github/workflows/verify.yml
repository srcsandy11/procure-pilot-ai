name: Verify Procure Pilot
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      database:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: procure_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: integration-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:integration-test@localhost:5432/procure_test
      PROCURE_TEST_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application dependencies
        run: |
          python -m pip install -r requirements.txt
          for extra in requirements-ai.txt requirements-ui.txt; do
            if test -f "$extra"; then python -m pip install -r "$extra"; fi
          done
      - name: Seed a real PostgreSQL database twice
        run: |
          python -m procure_pilot init-db
          python -m procure_pilot init-db
      - name: Verify rules and database workflows
        run: |
          python -m unittest discover -s tests -v
          python -m procure_pilot demo --store postgres --stage revised --json
